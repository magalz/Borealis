version: 2
updates:
  # Gradle dependencies, including the Gradle wrapper and the libraries inherited from
  # Moonlight (in the version catalog): while harvesting upstream, build tooling may move ahead of it when CI
  # passes (ADR 0047). AGP is declared twice (apps/android/build.gradle and the version
  # catalog), so it stays ignored until it has a single source.
  - package-ecosystem: gradle
    directories:
      - /apps/android
      - /apps/android/build-logic
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: com.android.tools.build:gradle
    groups:
      kotlin-and-ksp:
        patterns: ['org.jetbrains.kotlin*', 'com.google.devtools.ksp*']
      quality-tooling:
        patterns: ['com.diffplug.spotless*', 'io.gitlab.arturbosch.detekt*', 'dev.detekt*', 'com.facebook:ktfmt']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']

  # moonlight-common-c is intentionally not tracked here: it is vendored under
  # core/third_party and takes upstream fixes only by cherry-pick (ADR 0054).
