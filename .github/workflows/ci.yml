name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep in sync with docs/development/building.md (local formatting must match CI).
  CLANG_FORMAT_VERSION: '22.1.8'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      android: ${{ steps.filter.outputs.android }}
      core: ${{ steps.filter.outputs.core }}
      docs: ${{ steps.filter.outputs.docs }}
      design: ${{ steps.filter.outputs.design }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            android:
              - 'apps/android/**'
              - 'design/**'
              - 'core/**'
              - 'core/third_party/**'
              - '.github/workflows/ci.yml'
            core:
              - 'core/**'
              - '.github/workflows/ci.yml'
            docs:
              - '**/*.md'
              - '.markdownlint.jsonc'
              - '.github/workflows/ci.yml'
            design:
              # The tests of the contrast tool also read the glass table, the icons, the clips and the
              # launcher layers that design/icon/generate.py writes.
              - 'design/**'
              - 'apps/android/borealis/designsystem/src/main/kotlin/io/github/magalz/borealis/designsystem/glass/GlassContrastTable.kt'
              - 'apps/android/borealis/designsystem/src/main/kotlin/io/github/magalz/borealis/designsystem/components/BorealisIcons.kt'
              - 'apps/android/borealis/designsystem/src/main/res/raw/background_*.mp4'
              - 'apps/android/app/src/main/res/drawable/borealis_*.xml'
              - '.github/workflows/ci.yml'

  android:
    name: Android
    needs: changes
    if: needs.changes.outputs.android == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/android
    env:
      HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # version is derived from android-v* tags
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Install pinned clang-format (Spotless formats Borealis C/C++ sources)
        run: pipx install "clang-format==${CLANG_FORMAT_VERSION}"
      - name: Install Android SDK packages (same versions as local builds)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.14206865" "cmake;4.1.2" > /dev/null
      - name: Check the lint baseline is machine-independent
        run: |
          test -f app/lint-baseline.xml || { echo "::error::apps/android/app/lint-baseline.xml is missing"; exit 1; }
          if grep -nE 'file="([A-Za-z]:)?/|local\.properties|`src\\' app/lint-baseline.xml; then
            echo "::error file=apps/android/app/lint-baseline.xml::The lint baseline contains machine-specific entries (absolute paths, local.properties or Windows paths). See docs/development/building.md#lint-baseline."
            exit 1
          fi
      - name: Format, static analysis, licences, unit tests, coverage and build
        run: ./gradlew --stacktrace spotlessCheck detekt lint testDebugUnitTest :build-logic:test assembleDebug licensee koverXmlReportBorealis
      - name: Upload Android coverage to Codecov
        if: env.HAS_CODECOV_TOKEN == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          url: https://pipeline.magalz.space
          token: ${{ secrets.CODECOV_TOKEN }}
          files: apps/android/build/reports/kover/coverage.xml
          flags: android
          disable_search: true
          fail_ci_if_error: true
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: borealis-android-debug
          path: apps/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-reports
          path: |
            apps/android/build/reports/
            apps/android/**/build/reports/
            apps/android/**/build/test-results/
          retention-days: 14

  screenshots:
    # Compose screenshot references are recorded on Windows, so they are verified on Windows:
    # text rasterization differs between operating systems. The Android job above renders the
    # same tests without comparing them.
    name: Android screenshots
    needs: changes
    if: needs.changes.outputs.android == 'true' || github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: apps/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # version is derived from android-v* tags
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Install Android SDK packages (same versions as local builds)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager.bat"
          if [ ! -d "$ANDROID_HOME/platforms/android-37.0" ] || [ ! -d "$ANDROID_HOME/build-tools/37.0.0" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null || true
            "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
          fi
      - name: Verify the screenshot tests against the committed references
        run: ./gradlew --stacktrace :borealis:designsystem:testDebugUnitTest :borealis:library:testDebugUnitTest :borealis:stream:testDebugUnitTest :borealis:settings:testDebugUnitTest -Proborazzi.test.verify=true
      - name: Upload screenshot differences and test reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-screenshot-differences
          path: |
            apps/android/**/build/outputs/roborazzi/**
            apps/android/**/build/reports/tests/
            apps/android/**/build/test-results/
          retention-days: 14

  core:
    name: Core (C++)
    # Runs on every pull request (about a minute) so each PR uploads coverage
    # and Codecov always posts the required codecov/* statuses (ADR 0049).
    needs: changes
    # Pinned: the distribution clang-tidy on Ubuntu 26.04 adds modernize-use-designated-initializers
    # findings (core/src/pair.cpp). Moving this job to ubuntu-latest is planned for Sprint 20 (docs/roadmap.md).
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: core
    env:
      CC: clang
      CXX: clang++
      HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install toolchain
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build clang clang-tidy llvm
          pipx install "clang-format==${CLANG_FORMAT_VERSION}"
      - name: Check formatting
        run: find include src tests fuzz -type f \( -name '*.h' -o -name '*.hpp' -o -name '*.cpp' \) -print0 | xargs -0 --no-run-if-empty clang-format --dry-run --Werror
      - name: Build and test (dev, warnings as errors)
        run: |
          cmake --preset dev -DBOREALIS_CORE_WARNINGS_AS_ERRORS=ON
          cmake --build --preset dev
          ctest --preset dev
      - name: Static analysis (clang-tidy)
        run: find src -type f -name '*.cpp' -print0 | xargs -0 --no-run-if-empty clang-tidy -p build/dev --warnings-as-errors='*'
      - name: Build and test with sanitizers (ASan + UBSan)
        run: |
          cmake --preset asan -DBOREALIS_CORE_WARNINGS_AS_ERRORS=ON
          cmake --build --preset asan
          ctest --preset asan
      # libFuzzer needs Linux clang (the Windows toolchain has no libFuzzer), so fuzzing only runs here.
      # It runs when core changed and on main, not on every PR (ADR 0049 keeps the core job itself on every PR).
      - name: Fuzz the host rules (libFuzzer, 60 s per target)
        if: needs.changes.outputs.core == 'true' || github.event_name != 'pull_request'
        run: |
          cmake -S . -B build/fuzz -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBOREALIS_CORE_BUILD_TESTS=OFF \
                -DBOREALIS_CORE_BUILD_FUZZERS=ON -DBOREALIS_CORE_SANITIZE=ON
          cmake --build build/fuzz
          mkdir -p build/fuzz/corpus/appversion build/fuzz/corpus/launch build/fuzz/artifacts
          build/fuzz/fuzz/appversion_fuzz build/fuzz/corpus/appversion \
                -max_total_time=60 -artifact_prefix=build/fuzz/artifacts/
          build/fuzz/fuzz/launch_message_fuzz build/fuzz/corpus/launch -dict=fuzz/launch_message_fuzz.dict \
                -max_total_time=60 -artifact_prefix=build/fuzz/artifacts/
      - name: Upload fuzz crash reproducers
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-fuzz-artifacts
          path: core/build/fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14
      - name: Coverage (llvm-cov)
        working-directory: .
        run: sh core/scripts/coverage.sh
      - name: Upload core coverage to Codecov
        if: env.HAS_CODECOV_TOKEN == 'true'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          url: https://pipeline.magalz.space
          token: ${{ secrets.CODECOV_TOKEN }}
          files: core/build/coverage/coverage.lcov
          flags: core
          disable_search: true
          fail_ci_if_error: true

  design:
    # The contrast tool (design/accessibility) measures the text over the backgrounds and writes the
    # glass table of the app. Its tests are plain unittest; the versions are those it was tried with.
    name: Design tools
    needs: changes
    if: needs.changes.outputs.design == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install the packages of the contrast tool
        run: python -m pip install numpy==2.4.6 pillow==12.2.0
      - name: Test the contrast tool
        run: python -I -m unittest discover -s design/accessibility -v

  docs:
    name: Docs
    needs: changes
    if: needs.changes.outputs.docs == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint Markdown (Borealis-owned docs only)
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          # Rules come from .markdownlint.jsonc and ignores from .markdownlint-cli2.jsonc (auto-discovered).
          globs: |
            *.md
            docs/**/*.md
            core/**/*.md
            .github/**/*.md
            apps/android/borealis/**/*.md
            design/**/*.md

  ci-ok:
    name: CI result
    # Single required status check: passes when every job that ran succeeded or was skipped.
    if: always()
    needs: [changes, android, screenshots, core, design, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "::error::A CI job finished with result '$r'"
              exit 1
            fi
          done
