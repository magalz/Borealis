name: Release

# Pushing an android-vX.Y.Z tag builds the unsigned artifacts (no secrets), then waits for the
# owner's approval of the `release` environment before signing, attesting and creating a draft
# GitHub Release. Procedure: docs/development/release.md. Policy: docs/policies/release.md.
on:
  push:
    tags: ['android-v*']

permissions:
  contents: read

env:
  # Keep in sync with docs/development/building.md.
  BUILD_TOOLS_VERSION: '37.0.0'
  # Last upstream (Moonlight) commit before the Borealis import: the first changelog starts here.
  FIRST_RELEASE_BASE: 'f397cda5'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build unsigned artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0 # version comes from android-v* tags; the changelog needs the history
          persist-credentials: false
      - name: Validate the tag
        id: version
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^android-v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$TAG' is not android-vMAJOR.MINOR.PATCH. Pre-release tags are not supported yet: the Gradle version derivation skips them, so the APK would carry the previous version."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tagged commit is not reachable from main."
            exit 1
          fi
          echo "version=${TAG#android-v}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true # release artifacts never come from a shared build cache
      - name: Build unsigned APK and AAB, and the Gradle SBOM
        working-directory: apps/android
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./gradlew --stacktrace assembleNonRootRelease bundleNonRootRelease :app:cyclonedxDirectBom
          built=$(jq -r '.elements[0].versionName' app/build/outputs/apk/nonRoot/release/output-metadata.json)
          if [ "$built" != "$VERSION" ]; then
            echo "::error::The APK reports version '$built' but the tag is '$VERSION'."
            exit 1
          fi
      - name: Collect artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          cp apps/android/app/build/outputs/apk/nonRoot/release/app-nonRoot-release-unsigned.apk "dist/borealis-android-${VERSION}-unsigned.apk"
          cp apps/android/app/build/outputs/bundle/nonRootRelease/app-nonRoot-release.aab "dist/borealis-android-${VERSION}-unsigned.aab"
          cp apps/android/app/build/reports/sbom/borealis-android.cdx.json "dist/borealis-android-${VERSION}.cdx.json"
          cp apps/android/sbom/native-components.cdx.json "dist/borealis-android-native-${VERSION}.cdx.json"
      - name: Select the changelog range
        id: range
        run: |
          # Commits since the previous release; the first release starts after the Moonlight import.
          previous=$(git describe --tags --abbrev=0 --match 'android-v[0-9]*' --exclude 'android-v*-*' "${TAG}^" 2>/dev/null || true)
          if [ -n "$previous" ]; then
            echo "range=${previous}..${TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "range=${FIRST_RELEASE_BASE}..${TAG}" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate the release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          version: v2.14.2
          config: cliff.toml
          args: --strip header --output dist/release-notes.md ${{ steps.range.outputs.range }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: borealis-android-unsigned
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Sign, attest and create the draft release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Manual approval is configured on this environment by the owner; the signing secrets live here.
    environment: release
    permissions:
      contents: write # create the GitHub Release
      id-token: write # build-provenance attestations
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: borealis-android-unsigned
          path: unsigned
      - name: Locate the Android build tools
        run: |
          tools="${ANDROID_HOME}/build-tools/${BUILD_TOOLS_VERSION}"
          if [ ! -x "${tools}/apksigner" ]; then
            "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;${BUILD_TOOLS_VERSION}"
          fi
          echo "BUILD_TOOLS=${tools}" >> "$GITHUB_ENV"
      - name: Decode the signing keystore
        env:
          BOREALIS_KEYSTORE_BASE64: ${{ secrets.BOREALIS_KEYSTORE_BASE64 }}
        run: |
          umask 077
          keystore="${RUNNER_TEMP}/borealis-release.jks"
          printf '%s' "$BOREALIS_KEYSTORE_BASE64" | base64 -d > "$keystore"
          echo "KEYSTORE=${keystore}" >> "$GITHUB_ENV"
      - name: Sign the APK (v2 and v3) and the AAB
        env:
          BOREALIS_KEYSTORE_PASSWORD: ${{ secrets.BOREALIS_KEYSTORE_PASSWORD }}
          BOREALIS_KEY_ALIAS: ${{ secrets.BOREALIS_KEY_ALIAS }}
          BOREALIS_KEY_PASSWORD: ${{ secrets.BOREALIS_KEY_PASSWORD }}
        run: |
          mkdir -p dist
          # AGP already zip-aligns the APK; signing must not change the alignment.
          "${BUILD_TOOLS}/zipalign" -c -P 16 4 "unsigned/borealis-android-${VERSION}-unsigned.apk"
          "${BUILD_TOOLS}/apksigner" sign \
            --ks "$KEYSTORE" --ks-key-alias "$BOREALIS_KEY_ALIAS" \
            --ks-pass env:BOREALIS_KEYSTORE_PASSWORD --key-pass env:BOREALIS_KEY_PASSWORD \
            --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "dist/borealis-android-${VERSION}.apk" \
            "unsigned/borealis-android-${VERSION}-unsigned.apk"
          cp "unsigned/borealis-android-${VERSION}-unsigned.aab" "dist/borealis-android-${VERSION}.aab"
          jarsigner -keystore "$KEYSTORE" \
            -storepass:env BOREALIS_KEYSTORE_PASSWORD -keypass:env BOREALIS_KEY_PASSWORD \
            -digestalg SHA-256 "dist/borealis-android-${VERSION}.aab" "$BOREALIS_KEY_ALIAS"
      - name: Verify the signatures
        env:
          BOREALIS_KEYSTORE_PASSWORD: ${{ secrets.BOREALIS_KEYSTORE_PASSWORD }}
          BOREALIS_KEY_ALIAS: ${{ secrets.BOREALIS_KEY_ALIAS }}
        run: |
          apk="dist/borealis-android-${VERSION}.apk"
          aab="dist/borealis-android-${VERSION}.aab"
          report=$("${BUILD_TOOLS}/apksigner" verify --verbose --print-certs --min-sdk-version 24 "$apk")
          echo "$report" | grep -E 'Verified using v(2|3) scheme|Number of signers'
          echo "$report" | grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true'
          echo "$report" | grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true'
          "${BUILD_TOOLS}/zipalign" -c -P 16 4 "$apk"
          jarsigner -verify -certs "$aab" | grep -q 'jar verified'
          # The APK must be signed by the key in the keystore, not merely by some key.
          expected=$(keytool -list -keystore "$KEYSTORE" -storepass:env BOREALIS_KEYSTORE_PASSWORD \
            -alias "$BOREALIS_KEY_ALIAS" | sed -n 's/^Certificate fingerprint (SHA-256): //p' | tr -d ':[:space:]' | tr 'A-F' 'a-f')
          actual=$(echo "$report" | sed -nE 's/^(Signer #1|V3[.]0 Signer): certificate SHA-256 digest: //p' | head -n 1 | tr -d '[:space:]')
          if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
            echo "::error::The APK signer does not match the keystore certificate."
            exit 1
          fi
          echo "APK and AAB signatures verified"
      - name: Remove the keystore
        if: always()
        run: |
          if [ -n "${KEYSTORE:-}" ] && [ -f "$KEYSTORE" ]; then
            shred -u "$KEYSTORE" || rm -f "$KEYSTORE"
          fi
      - name: Compute checksums
        run: |
          cp "unsigned/borealis-android-${VERSION}.cdx.json" "unsigned/borealis-android-native-${VERSION}.cdx.json" unsigned/release-notes.md dist/
          cd dist
          sha256sum "borealis-android-${VERSION}.apk" "borealis-android-${VERSION}.aab" \
            "borealis-android-${VERSION}.cdx.json" "borealis-android-native-${VERSION}.cdx.json" > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/borealis-android-${{ env.VERSION }}.apk
            dist/borealis-android-${{ env.VERSION }}.aab
            dist/borealis-android-${{ env.VERSION }}.cdx.json
            dist/borealis-android-native-${{ env.VERSION }}.cdx.json
      - name: Create the draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" \
            "dist/borealis-android-${VERSION}.apk" \
            "dist/borealis-android-${VERSION}.aab" \
            "dist/SHA256SUMS" \
            "dist/borealis-android-${VERSION}.cdx.json" \
            "dist/borealis-android-native-${VERSION}.cdx.json" \
            --verify-tag --draft \
            --title "Borealis Android ${VERSION}" \
            --notes-file dist/release-notes.md
