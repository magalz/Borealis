name: Release

# Pushing an android-vX.Y.Z tag builds the unsigned APK (no secrets), then waits for the owner's
# approval of the `release` environment before signing, attesting and creating a draft GitHub
# Release. Procedure: docs/development/release.md. Policy: docs/policies/release.md.
#
# The same pipeline also runs as a dry run: started by hand, or by a pull request that touches the
# release machinery. The dry run uses a throwaway local tag and a throwaway keystore, needs no
# secrets and no environment, and publishes nothing.
on:
  push:
    tags: ['android-v*']
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/scripts/**'
      - '.github/release-compatibility.md'
      - 'apps/android/build-logic/**'
      - 'apps/android/app/proguard-rules.pro'
      - 'apps/android/gradle/libs.versions.toml'

permissions:
  contents: read

env:
  # Keep in sync with docs/development/building.md.
  BUILD_TOOLS_VERSION: '37.0.0'
  # The last commit of the Moonlight import (it registers the moonlight-common-c submodule). The
  # range FIRST_RELEASE_BASE..TAG excludes it and everything before it, which includes the whole
  # upstream Moonlight history (its last commit is b48494cb, "Version 12.2").
  FIRST_RELEASE_BASE: 'f397cda5'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build unsigned APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      # A dry run builds as the first release: versionName 0.1.0, versionCode 1000.
      TAG: ${{ github.event_name == 'push' && github.ref_name || 'android-v0.1.0' }}
    outputs:
      version: ${{ steps.tag.outputs.version || steps.dry-run-tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # version comes from android-v* tags; the changelog needs the history
          persist-credentials: false
      - name: Validate the tag
        id: tag
        if: github.event_name == 'push'
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^android-v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$TAG' is not android-vMAJOR.MINOR.PATCH. Pre-release tags are not supported yet: the Gradle version derivation skips them, so the APK would carry the previous version."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::The tagged commit is not reachable from main."
            exit 1
          fi
          echo "version=${TAG#android-v}" >> "$GITHUB_OUTPUT"
      - name: Create the throwaway dry-run tag
        id: dry-run-tag
        if: github.event_name != 'push'
        run: |
          # Local to this runner: the checkout holds no credentials and nothing here is pushed.
          # -f replaces a real tag of the same name that the full-history fetch may have brought in.
          git tag -f "$TAG" HEAD
          echo "version=${TAG#android-v}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true # release artifacts never come from a shared build cache
      - name: Install Android SDK packages (same versions as CI and local builds)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37.0" "build-tools;${BUILD_TOOLS_VERSION}" "ndk;29.0.14206865" "cmake;4.1.2" > /dev/null
      - name: Locate the Android build tools
        run: bash .github/scripts/use-build-tools.sh
      - name: Build the unsigned APK and the Gradle SBOM
        working-directory: apps/android
        env:
          VERSION: ${{ steps.tag.outputs.version || steps.dry-run-tag.outputs.version }}
        run: |
          ./gradlew --stacktrace assembleRelease :app:cyclonedxDirectBom
          built=$(jq -r '.elements[0].versionName' app/build/outputs/apk/release/output-metadata.json)
          if [ "$built" != "$VERSION" ]; then
            echo "::error::The APK reports version '$built' but the tag is '$VERSION'."
            exit 1
          fi
      - name: Check the APK identity and the R8 result
        env:
          VERSION: ${{ steps.tag.outputs.version || steps.dry-run-tag.outputs.version }}
        run: bash .github/scripts/check-apk.sh apps/android/app/build/outputs/apk/release/app-release-unsigned.apk "$VERSION"
      - name: Collect artifacts
        env:
          VERSION: ${{ steps.tag.outputs.version || steps.dry-run-tag.outputs.version }}
        run: |
          mkdir -p dist
          cp apps/android/app/build/outputs/apk/release/app-release-unsigned.apk "dist/borealis-android-${VERSION}-unsigned.apk"
          cp apps/android/app/build/reports/sbom/borealis-android.cdx.json "dist/borealis-android-${VERSION}.cdx.json"
          cp apps/android/sbom/native-components.cdx.json "dist/borealis-android-native-${VERSION}.cdx.json"
      - name: Select the changelog range
        id: range
        run: |
          # Commits since the previous release; the first release starts after the Moonlight import.
          previous=$(git describe --tags --abbrev=0 --match 'android-v[0-9]*' --exclude 'android-v*-*' "${TAG}^" 2>/dev/null || true)
          # Only a plain release tag may end up in the git-cliff arguments.
          if [ -n "$previous" ] && ! printf '%s' "$previous" | grep -Eq '^android-v[0-9]+[.][0-9]+[.][0-9]+$'; then
            echo "::warning::Ignoring unexpected previous tag name; the changelog starts at ${FIRST_RELEASE_BASE}."
            previous=""
          fi
          if [ -n "$previous" ]; then
            echo "range=${previous}..${TAG}" >> "$GITHUB_OUTPUT"
          else
            echo "range=${FIRST_RELEASE_BASE}..${TAG}" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate the release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          version: v2.14.2
          config: cliff.toml
          args: --strip header --output dist/release-notes.md ${{ steps.range.outputs.range }}
      - name: Add the compatibility note to the release notes
        run: |
          printf '\n' >> dist/release-notes.md
          cat .github/release-compatibility.md >> dist/release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: borealis-android-unsigned
          path: dist/
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 30 || 1 }}

  dry-run:
    name: Dry run - sign with a throwaway key
    needs: build
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: borealis-android-unsigned
          path: unsigned
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17' # keytool comes from this JDK, not the runner default
      - name: Locate the Android build tools
        run: bash .github/scripts/use-build-tools.sh
      - name: Create a throwaway keystore
        run: |
          umask 077
          keystore="${RUNNER_TEMP}/dry-run.jks"
          password=$(openssl rand -hex 16)
          echo "::add-mask::${password}"
          keytool -genkeypair -keystore "$keystore" -storepass "$password" -keypass "$password" \
            -alias dry-run -keyalg RSA -keysize 3072 -validity 1 -dname "CN=Borealis dry run, O=not a release"
          {
            echo "KEYSTORE=${keystore}"
            echo "BOREALIS_KEY_ALIAS=dry-run"
            echo "BOREALIS_KEYSTORE_PASSWORD=${password}"
            echo "BOREALIS_KEY_PASSWORD=${password}"
          } >> "$GITHUB_ENV"
      - name: Sign and verify the APK with the release script
        run: |
          mkdir -p dist
          # The release notes are included so the rendered notes and compatibility note can be read.
          cp "unsigned/borealis-android-${VERSION}.cdx.json" "unsigned/borealis-android-native-${VERSION}.cdx.json" unsigned/release-notes.md dist/
          bash .github/scripts/sign-apk.sh \
            "unsigned/borealis-android-${VERSION}-unsigned.apk" \
            "dist/borealis-android-${VERSION}-DRY-RUN-NOT-A-RELEASE.apk" \
            "borealis-android-${VERSION}.cdx.json" "borealis-android-native-${VERSION}.cdx.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: DRY-RUN-not-a-release
          path: dist/
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Sign, attest and create the draft release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Manual approval is configured on this environment by the owner; the signing secrets live here.
    environment: release
    permissions:
      contents: write # create the GitHub Release
      id-token: write # build-provenance attestations
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      # The tagged commit supplies the signing script, so the script that handles the secrets is
      # the one the owner reviewed with the tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: borealis-android-unsigned
          path: unsigned
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17' # keytool comes from this JDK, not the runner default
      - name: Locate the Android build tools
        run: bash .github/scripts/use-build-tools.sh
      - name: Decode the signing keystore
        env:
          BOREALIS_KEYSTORE_BASE64: ${{ secrets.BOREALIS_KEYSTORE_BASE64 }}
        run: |
          umask 077
          keystore="${RUNNER_TEMP}/borealis-release.jks"
          printf '%s' "$BOREALIS_KEYSTORE_BASE64" | base64 -d > "$keystore"
          echo "KEYSTORE=${keystore}" >> "$GITHUB_ENV"
      - name: Sign and verify the APK (v2 and v3), then write the checksums
        env:
          BOREALIS_KEYSTORE_PASSWORD: ${{ secrets.BOREALIS_KEYSTORE_PASSWORD }}
          BOREALIS_KEY_ALIAS: ${{ secrets.BOREALIS_KEY_ALIAS }}
          BOREALIS_KEY_PASSWORD: ${{ secrets.BOREALIS_KEY_PASSWORD }}
        run: |
          mkdir -p dist
          cp "unsigned/borealis-android-${VERSION}.cdx.json" "unsigned/borealis-android-native-${VERSION}.cdx.json" unsigned/release-notes.md dist/
          bash .github/scripts/sign-apk.sh \
            "unsigned/borealis-android-${VERSION}-unsigned.apk" \
            "dist/borealis-android-${VERSION}.apk" \
            "borealis-android-${VERSION}.cdx.json" "borealis-android-native-${VERSION}.cdx.json"
      - name: Remove the keystore
        if: always()
        run: |
          if [ -n "${KEYSTORE:-}" ] && [ -f "$KEYSTORE" ]; then
            shred -u "$KEYSTORE" || rm -f "$KEYSTORE"
          fi
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/borealis-android-${{ env.VERSION }}.apk
            dist/borealis-android-${{ env.VERSION }}.cdx.json
            dist/borealis-android-native-${{ env.VERSION }}.cdx.json
            dist/SHA256SUMS
      - name: Create the draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" \
            "dist/borealis-android-${VERSION}.apk" \
            "dist/SHA256SUMS" \
            "dist/borealis-android-${VERSION}.cdx.json" \
            "dist/borealis-android-native-${VERSION}.cdx.json" \
            --verify-tag --draft \
            --title "Borealis Android ${VERSION}" \
            --notes-file dist/release-notes.md
