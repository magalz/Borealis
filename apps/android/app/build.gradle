// BOREALIS: identity, minSdk, signing, Hilt and lint settings come from this convention plugin (build-logic).
plugins {
    id 'borealis.android.application'
}

apply plugin: 'com.android.application'

android {
    ndkVersion "29.0.14206865"

    compileSdk 37

    namespace 'com.limelight'

    defaultConfig {
        targetSdk 36

        // Generate native debug symbols to allow Google Play to symbolicate our native crashes
        ndk.debugSymbolLevel = 'FULL'
    }

    buildFeatures {
        buildConfig = true
        resValues = true
    }

    compileOptions {
        encoding "UTF-8"
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    lint {
        lintConfig file('lint.xml')
    }

    bundle {
        density {
            // FIXME: This should not be necessary but we get
            // weird crashes due to missing drawable resources
            // when this split is enabled.
            enableSplit = false
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/jni/Android.mk"
        }
    }

    packaging {
        resources {
            // BouncyCastle includes duplicate LICENSE.md files
            excludes += '/META-INF/*.md'
        }
    }
}

dependencies {
    implementation libs.bouncycastle.bcprov
    implementation libs.bouncycastle.bcpkix
    implementation libs.jcodec
    implementation libs.okhttp // BOREALIS: version catalog (single source with :borealis:host)
    implementation libs.jmdns
    implementation libs.shield.controller.extensions

    coreLibraryDesugaring libs.desugar.jdk.libs
}
