# Borealis detekt overrides on top of the default config (buildUponDefaultConfig = true).
style:
  # Every text goes through the design-system Text, which adds the word spacing of the Text
  # spacing setting (ADR 0058, decision 4). Its own file imports Material's and suppresses this.
  ForbiddenImport:
    active: true
    forbiddenImports:
      - value: 'androidx.compose.material3.Text'
        reason: 'Use io.github.magalz.borealis.designsystem.components.Text: it adds the word spacing of the Text spacing setting.'
  ReturnCount:
    max: 3
  MagicNumber:
    ignoreEnums: true
naming:
  FunctionNaming:
    ignoreAnnotated:
      - Composable
  # The inherited package com.limelight.binding.input.virtual_controller keeps its name (ADR 0059,
  # rule 1.3), and the default pattern rejects the underscore in it. Main and test sources.
  PackageNaming:
    excludes: ['**/virtual_controller/**']
  # A Compose file is named after its composable and keeps beside it the one small type that the
  # composable takes (an enum, a state or an action class). The rule sees only that class and asks
  # for a rename or a file of its own. No option fits: mustBeFirst skips a file only when a function
  # comes first, and ignoreAnnotated does not reach a file's composables.
  MatchingDeclarationName:
    active: false
complexity:
  LongParameterList:
    # A Robolectric shadow method (@Implementation) mirrors the signature it replaces.
    ignoreAnnotated:
      - Composable
      - Implementation
    # Test sources follow the rule outside :app. Drop these excludes when the :app tests are fixed
    # (Sprint 14).
    excludes: ['**/app/src/test/**', '**/app/src/androidTest/**']
coroutines:
  # Tests inject their dispatchers, outside :app as in main code. Drop these excludes when the
  # :app tests are fixed (Sprint 14).
  InjectDispatcher:
    excludes: ['**/app/src/test/**', '**/app/src/androidTest/**']
