# Borealis version catalog. Upstream Moonlight dependencies stay declared in app/build.gradle.
[versions]
agp = "9.4.0"
androidx-test-ext = "1.3.0"
androidx-test-runner = "1.7.0"
detekt = "2.0.0-alpha.6"
hilt = "2.60.1"
junit = "4.13.2"
# Kotlin Gradle plugin bundled with AGP 9.4.0 (built-in Kotlin); keep in sync with AGP.
kotlin = "2.2.10"
ksp = "2.3.12"
ktfmt = "0.64"
spotless = "8.10.4"
truth = "1.4.5"

[libraries]
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
detekt-gradlePlugin = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-gradlePlugin = { module = "com.google.dagger:hilt-android-gradle-plugin", version.ref = "hilt" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
spotless-gradlePlugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }

[plugins]
