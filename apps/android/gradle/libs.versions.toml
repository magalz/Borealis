# Borealis version catalog. Upstream Moonlight dependencies stay declared in app/build.gradle.
[versions]
agp = "9.4.0"
androidx-test-ext = "1.3.0"
androidx-test-runner = "1.7.0"
cyclonedx = "3.4.1"
detekt = "2.0.0-alpha.6"
hilt = "2.60.1"
junit = "4.13.2"
# Kotlin Gradle plugin used by AGP built-in Kotlin. It may lead the version bundled with
# AGP when CI passes (ADR 0047); Dependabot groups it with KSP.
kotlin = "2.4.21"
kover = "0.9.11"
ksp = "2.3.12"
ktfmt = "0.64"
licensee = "1.14.1"
okhttp = "5.5.0"
spotless = "8.10.4"
truth = "1.4.5"

[libraries]
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
cyclonedx-gradlePlugin = { module = "org.cyclonedx:cyclonedx-gradle-plugin", version.ref = "cyclonedx" }
detekt-gradlePlugin = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-gradlePlugin = { module = "com.google.dagger:hilt-android-gradle-plugin", version.ref = "hilt" }
junit = { module = "junit:junit", version.ref = "junit" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kover-gradlePlugin = { module = "org.jetbrains.kotlinx:kover-gradle-plugin", version.ref = "kover" }
ksp-gradlePlugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
licensee-gradlePlugin = { module = "app.cash.licensee:licensee-gradle-plugin", version.ref = "licensee" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
spotless-gradlePlugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }

[plugins]
