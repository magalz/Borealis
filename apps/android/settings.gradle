// BOREALIS: Borealis convention plugins and root tooling live in the build-logic included build.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    includeBuild('build-logic')
}

plugins {
    id 'borealis.settings'
}

include ':app'
// BOREALIS: Borealis Kotlin modules.
include ':borealis:designsystem'
include ':borealis:diagnostics'
include ':borealis:host'
include ':borealis:library'
include ':borealis:logging'
include ':borealis:native'
include ':borealis:settings'
