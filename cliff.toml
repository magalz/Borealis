# git-cliff configuration: https://git-cliff.org/docs/configuration
# Conventional Commits -> Keep a Changelog sections.
# Usage: git cliff --latest   |   git cliff --unreleased --tag android-vX.Y.Z

[changelog]
header = """
# Changelog

All notable changes to Borealis for Android are documented in this file.
The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/)
and this project adheres to [Semantic Versioning](https://semver.org/).
"""
body = """
{{ "\n" }}{% if version -%}
## [{{ version | trim_start_matches(pat="android-v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}

{% for commit in commits -%}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | upper_first | trim }}{% if commit.breaking %} **(breaking)**{% endif %} ({{ commit.id | truncate(length=7, end="") }})
{% endfor -%}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = true
tag_pattern = '^android-v[0-9]+\.[0-9]+\.[0-9]+.*'
sort_commits = "oldest"
topo_order = false

commit_preprocessors = [
  { pattern = '\s*\(#(\d+)\)\s*$', replace = " (#${1})" },
]

commit_parsers = [
  # Merge commits are noise; the merged commits are listed instead.
  { message = "^Merge ", skip = true },
  { message = "^Revert ", skip = true },
  # Anything scoped (security) is a security change regardless of type.
  { message = '^[a-z]+\(security\)', group = "Security" },
  { message = "^feat", group = "Added" },
  { message = "^sync", group = "Upstream" },
  { message = "^fix", group = "Fixed" },
  { message = "^security", group = "Security" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^revert", group = "Changed" },
  { message = "^docs", group = "Documentation" },
  # Housekeeping is not user-facing.
  { message = "^(test|build|ci|chore|style)", skip = true },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = false
initial_tag = "android-v0.1.0"
