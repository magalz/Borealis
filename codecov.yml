# Codecov configuration (self-hosted instance: https://pipeline.magalz.space).
# Gate (ADR 0049): new code in a pull request needs at least 90% line
# coverage, and total coverage may not drop by more than 1%.
codecov:
  branch: main

coverage:
  precision: 2
  round: down
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: false
        if_not_found: success
    patch:
      default:
        target: 90%
        informational: false
        if_not_found: success

parsers:
  jacoco:
    # Kotlin `when`, null-safety and default arguments produce partially
    # covered lines in JaCoCo-format reports; count them as covered.
    partials_as_hits: true

flag_management:
  individual_flags:
    - name: android
      paths:
        - apps/android/borealis/
        - apps/android/build-logic/
        - apps/android/app/src/main/kotlin/
      carryforward: true
    - name: core
      paths:
        - core/include/
        - core/src/
      carryforward: true

comment:
  layout: "diff, flags, files"
  behavior: default
  require_changes: false

ignore:
  # The vendored moonlight-core JNI sources and moonlight-common-c have no
  # Borealis tests.
  - "apps/android/app/src/main/jni/moonlight-core/**"
  - "core/third_party/**"
  # Tests and generated code.
  - "**/src/test/**"
  - "**/src/androidTest/**"
  - "core/tests/**"
  - "core/build/**"
